name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: websites
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        run: |
          rsync -a --delete --exclude='.git' ./ /var/www/morse-trainer/
          deploy add morse-trainer /var/www/morse-trainer --port 8085
